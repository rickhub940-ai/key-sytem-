<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>999MS Realtime</title><style>html{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090d16;color:#e7edf8;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.w{max-width:1120px;margin:auto;padding:32px 20px}h1{font-size:24px;margin:0}p{color:#9bacbf}.bar,.card{background:#111827;border:1px solid #263247;border-radius:12px}.bar{display:flex;gap:10px;align-items:center;padding:12px;margin:24px 0}.bar input{flex:1;min-width:0}.bar button{white-space:nowrap}input,button{border:1px solid #33435e;border-radius:8px;padding:10px 12px;font:inherit}input{color:#eef4ff;background:#0c1320}button{color:#fff;background:#2563eb;cursor:pointer}button:hover{background:#1d4ed8}button.warn{background:#b91c1c}button.warn:hover{background:#991b1b}button.alt{background:#344156}button.alt:hover{background:#475569}.meta{display:flex;gap:16px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid #263247;color:#aebdd0}.ok{color:#86efac}.bad{color:#fca5a5}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:13px 16px;text-align:left;border-bottom:1px solid #202b3d}th{font-size:12px;text-transform:uppercase;color:#90a2ba}td{white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;gap:7px}.actions button{padding:6px 9px;font-size:12px}.empty{text-align:center;color:#9bacbf;padding:38px}.foot{margin-top:14px;font-size:12px;color:#8293ab}@media(max-width:640px){.w{padding:20px 12px}.bar{align-items:stretch;flex-wrap:wrap}.bar input{flex-basis:100%}}</style></head><body><main class="w"><h1>999MS Realtime Control</h1><p>ดู session ที่กำลังเชื่อมต่อและควบคุมเฉพาะคำสั่งที่อนุญาต</p><section class="bar"><input id="t" type="password" autocomplete="off" placeholder="Admin token"><button id="c">เชื่อมต่อ</button><button id="r" class="alt">รีเฟรช</button></section><section class="card"><div class="meta"><strong id="s">ยังไม่ได้เชื่อมต่อ</strong><span id="n">0 sessions</span><span>รีเฟรชทุก 10 วินาที</span></div><div class="scroll"><table><thead><tr><th>Session</th><th>HWID hash</th><th>Script</th><th>เชื่อมต่อเมื่อ</th><th>ใช้งานล่าสุด</th><th>ควบคุม</th></tr></thead><tbody id="b"><tr><td class="empty" colspan="6">ป้อน Admin token แล้วกดเชื่อมต่อ</td></tr></tbody></table></div></section><p class="foot">Token จะเก็บในหน้านี้ชั่วคราวเท่านั้น และไม่บันทึกลง browser storage</p></main><script>const q=x=>document.querySelector(x),t=q('#t'),b=q('#b'),s=q('#s'),n=q('#n');let k='',i=0;const h={get(){return{'x-admin-token':k}},post(){return{'content-type':'application/json','x-admin-token':k}}};function d(x){return new Date(x).toLocaleString()}function cell(r,x){const e=document.createElement('td');e.textContent=x;return e}function button(x,c,id){const e=document.createElement('button');e.textContent=x;e.className=c;e.onclick=()=>go(id,x);return e}function rows(a){b.replaceChildren();n.textContent=`${a.length} sessions`;if(!a.length){const r=document.createElement('tr'),e=cell(r,'ไม่มี client ที่ออนไลน์');e.colSpan=6;r.append(e);b.append(r);return}for(const x of a){const r=document.createElement('tr');r.append(cell(r,x.sessionId),cell(r,`${x.hwidHash.slice(0,16)}…`),cell(r,x.scriptName),cell(r,d(x.connectedAt)),cell(r,`${Math.ceil(x.idleMs/1000)}s`));const e=document.createElement('td'),z=document.createElement('div');z.className='actions';z.append(button('ตัดการเชื่อมต่อ','warn',x.sessionId),button('ให้ยืนยันใหม่','alt',x.sessionId));e.append(z);r.append(e);b.append(r)}}async function load(){if(!k)return;try{const r=await fetch('/api/realtime/sessions',{headers:h.get()}),j=await r.json();if(!r.ok)throw Error(j.error||'request failed');s.textContent='เชื่อมต่อแล้ว';s.className='ok';rows(j.sessions)}catch(e){s.textContent=e.message;s.className='bad';b.replaceChildren();const r=document.createElement('tr'),e2=cell(r,'ไม่สามารถอ่าน session ได้');e2.colSpan=6;r.append(e2);b.append(r)}}async function go(id,label){const command=label==='ตัดการเชื่อมต่อ'?'disconnect':'reauth';if(!confirm(`${label} session นี้?`))return;const r=await fetch('/api/realtime/command',{method:'POST',headers:h.post(),body:JSON.stringify({sessionId:id,command})});if(!r.ok){const j=await r.json().catch(()=>({}));alert(j.error||'command failed')}await load()}q('#c').onclick=()=>{k=t.value.trim();load();clearInterval(i);i=setInterval(load,10000)};q('#r').onclick=load;</script></body></html>
